seed: 42

data:
  source_dataset: "SIS-2024-spring/coco_vqa_small_dataset"
  source_split: "train"
  max_examples: 1269
  train_ratio: 0.70
  val_ratio: 0.10
  test_ratio: 0.20
  num_options: 4
  max_answer_pool: 200
  min_answer_frequency: 1

models:
  image_encoder: "openai/clip-vit-base-patch32"
  text_encoder: "sentence-transformers/all-MiniLM-L6-v2"
  dropout: 0.30
  hidden_dim: 256
  max_text_length: 128
  freeze_encoders: true

training:
  batch_size: 16
  epochs: 8
  learning_rate: 0.0002
  weight_decay: 0.0001
  patience: 2
  num_workers: 0

paths:
  data_dir: "data"
  processed_dir: "data/processed"
  checkpoint_dir: "checkpoints"
  output_dir: "outputs"
